<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кузница Гнева</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #ui-container {
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ui-box {
            background: #14161f;
            border: 1px solid #232736;
            border-radius: 14px;
            padding: 8px 16px;
            text-align: center;
        }
        .ui-label { font-size: 10px; color: #717b9e; text-transform: uppercase; font-weight: 700; }
        .ui-value { font-size: 22px; font-weight: 900; color: #f3f4f6; }
        
        #game-area {
            position: relative;
            width: 330px;
            height: 480px;
            background: radial-gradient(circle at 50% 35%, #1f2333, #0a0b10);
            border: 2px solid #2d334a;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
            cursor: pointer;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            overflow: hidden;
        }
        #stage-info { text-align: center; }
        #item-name {
            font-size: 20px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
        }
        #item-level {
            font-size: 11px;
            color: #8b92a5;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        /* Сцена наковальни и молота */
        #anvil-stage {
            position: relative;
            width: 260px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Наковальня — жестко привязана к низу площадки */
        #anvil {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 90px;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
        }

        /* Предмет — сидит строго на верхней площадке наковальни */
        #target-item {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            object-fit: contain;
            z-index: 3;
            transition: transform 0.05s ease-out, opacity 0.08s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        /* Молот в боевом замахе (сверху-справа) */
        #hammer {
            position: absolute;
            bottom: 50px;
            left: 105px;
            width: 140px;
            height: 140px;
            object-fit: contain;
            transform-origin: 20% 80%; /* Конец рукояти */
            transform: rotate(25deg) translate(25px, -60px);
            transition: transform 0.07s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(-6px 10px 15px rgba(0,0,0,0.7));
        }

        /* Точный удар: боёк бьёт по центру предмета сверху-вниз */
        #hammer.hit {
            transform: rotate(-32deg) translate(-28px, 12px);
        }

        /* Промах */
        #hammer.broken {
            transform: rotate(70deg) translate(60px, 30px);
            opacity: 0.2;
        }

        #glow {
            position: absolute;
            bottom: 25px;
            width: 160px;
            height: 40px;
            background: radial-gradient(ellipse, rgba(56, 189, 248, 0.25), transparent 70%);
            z-index: 1;
        }

        /* Тайминг-бар */
        #bar-container {
            position: relative;
            width: 100%;
            height: 40px;
            background: #090a0f;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #232736;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }
        #target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            background: linear-gradient(180deg, #4ade80, #16a34a);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
            transition: left 0.15s, width 0.15s;
        }
        #cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #ffffff;
            box-shadow: 0 0 14px #ffffff, 0 0 4px #ffffff;
            border-radius: 3px;
        }
        #hint {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: 1px;
        }
        .particle {
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        .shake { animation: shakeEffect 0.28s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-6px, 3px); }
            80% { transform: translate(6px, -3px); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">
            <div class="ui-label">Разбито</div>
            <div class="ui-value" id="current-score">0</div>
        </div>
        <div class="ui-box">
            <div class="ui-label">Рекорд</div>
            <div class="ui-value" id="best-score" style="color: #eab308;">0</div>
        </div>
    </div>

    <div id="game-area">
        <div id="stage-info">
            <div id="item-name">Куриное яйцо</div>
            <div id="item-level">ПРЕДМЕТ 1 ИЗ 2</div>
        </div>

        <div id="anvil-stage">
            <div id="glow"></div>
            <img id="anvil" src="images/anvil.png?v=3" alt="Наковальня">
            <img id="target-item" src="images/egg.png?v=3" alt="Предмет">
            <img id="hammer" src="images/hammer.png?v=3" alt="Молот">
        </div>

        <div id="bar-container">
            <div id="target-zone"></div>
            <div id="cursor"></div>
        </div>

        <div id="hint">ТАПАЙ В ЗЕЛЕНУЮ ЗОНУ</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const ITEMS = [
            { name: "Куриное яйцо", src: "images/egg.png?v=3", color: ["#ffffff", "#fef08a", "#f59e0b"], haptic: "light", freq: 520 },
            { name: "Спелый томат", src: "images/tomato.png?v=3", color: ["#ef4444", "#dc2626", "#84cc16"], haptic: "light", freq: 440 }
        ];

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound(freq, isFail = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isFail) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
                return;
            }

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.35, now + 0.12);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        // Haptic Feedback
        function triggerHaptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('medium');
                else if (type === 'fail') tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            if (navigator.vibrate) {
                if (type === 'light') navigator.vibrate(25);
                else if (type === 'fail') navigator.vibrate([70, 50, 120]);
            }
        }

        function createShatterEffect(colors) {
            const stage = document.getElementById('anvil-stage');
            for (let i = 0; i < 24; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.bottom = '95px';
                stage.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 80 + 25;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist - 20;

                p.animate([
                    { transform: 'translate(-50%, 0) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), ${y}px) scale(0)`, opacity: 0 }
                ], { duration: 360 + Math.random() * 180, easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)' }).onfinish = () => p.remove();
            }
        }

        let currentIndex = 0;
        let bestScore = 0;
        let cursorPosition = 0;
        let direction = 1;
        let isProcessingHit = false;

        const cursorEl = document.getElementById('cursor');
        const targetEl = document.getElementById('target-zone');
        const scoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const gameAreaEl = document.getElementById('game-area');
        const itemNameEl = document.getElementById('item-name');
        const itemLevelEl = document.getElementById('item-level');
        const targetItemEl = document.getElementById('target-item');
        const hammerEl = document.getElementById('hammer');

        let targetStart = 35;
        let targetWidth = 26;
        let speed = 1.3;

        function updateItemDisplay() {
            const item = ITEMS[currentIndex];
            itemNameEl.innerText = item.name;
            itemLevelEl.innerText = `ПРЕДМЕТ ${currentIndex + 1} ИЗ ${ITEMS.length}`;
            targetItemEl.src = item.src;
            targetItemEl.style.opacity = '1';
            targetItemEl.style.transform = 'translateX(-50%) scale(1)';

            targetWidth = Math.max(8, 28 - currentIndex * 3);
            targetStart = Math.random() * (100 - targetWidth - 10) + 5;
            speed = 1.3 + (currentIndex * 0.35);

            targetEl.style.left = targetStart + '%';
            targetEl.style.width = targetWidth + '%';
        }

        function gameLoop() {
            cursorPosition += direction * speed;
            if (cursorPosition >= 100) { cursorPosition = 100; direction = -1; }
            else if (cursorPosition <= 0) { cursorPosition = 0; direction = 1; }
            cursorEl.style.left = cursorPosition + '%';
            requestAnimationFrame(gameLoop);
        }

        function handleHit(e) {
            e.preventDefault();
            if (isProcessingHit) return;

            const item = ITEMS[currentIndex];
            const targetEnd = targetStart + targetWidth;
            const hitSuccess = cursorPosition >= targetStart && cursorPosition <= targetEnd;

            hammerEl.classList.add('hit');

            if (hitSuccess) {
                isProcessingHit = true;
                setTimeout(() => {
                    playHitSound(item.freq);
                    triggerHaptic(item.haptic);
                    createShatterEffect(item.color);

                    targetItemEl.style.transform = 'translateX(-50%) scale(1.3, 0.15)';
                    targetItemEl.style.opacity = '0';
                }, 55);

                setTimeout(() => {
                    hammerEl.classList.remove('hit');
                }, 130);

                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % ITEMS.length;
                    scoreEl.innerText = Number(scoreEl.innerText) + 1;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 170);

            } else {
                isProcessingHit = true;
                playHitSound(0, true);
                triggerHaptic('fail');

                hammerEl.classList.add('broken');
                gameAreaEl.classList.add('shake');

                const finalScore = Number(scoreEl.innerText);
                if (finalScore > bestScore) {
                    bestScore = finalScore;
                    bestScoreEl.innerText = bestScore;
                }

                setTimeout(() => {
                    hammerEl.classList.remove('hit');
                    hammerEl.classList.remove('broken');
                    gameAreaEl.classList.remove('shake');
                    currentIndex = 0;
                    scoreEl.innerText = 0;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 400);
            }
        }

        gameAreaEl.addEventListener('pointerdown', handleHit);

        updateItemDisplay();
        gameLoop();
    </script>
</body>
</html>
