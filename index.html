<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кузница Гнева</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0f0f13;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #score-board {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        #best-score {
            font-size: 13px;
            color: #71717a;
            margin-top: 4px;
            font-weight: 500;
        }
        #game-area {
            position: relative;
            width: 320px;
            height: 420px;
            background: #18181b;
            border: 2px solid #27272a;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        #anvil-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #item {
            width: 90px;
            height: 90px;
            background: #27272a;
            border: 2px solid #3f3f46;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            transition: transform 0.05s ease-out;
            position: relative;
            z-index: 2;
        }
        #bar-container {
            position: relative;
            width: 100%;
            height: 36px;
            background: #09090b;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #27272a;
        }
        #target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            background: #16a34a;
            border-radius: 6px;
            transition: left 0.15s, width 0.15s;
        }
        #perfect-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30%;
            left: 35%;
            background: #eab308;
            border-radius: 4px;
        }
        #cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #fff;
            box-shadow: 0 0 12px #fff;
            border-radius: 3px;
        }
        #hint {
            font-size: 12px;
            font-weight: 600;
            color: #71717a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        .shake { animation: shakeEffect 0.25s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 4px); }
            40% { transform: translate(10px, -4px); }
            60% { transform: translate(-6px, 2px); }
            80% { transform: translate(6px, -2px); }
        }
    </style>
</head>
<body>

    <div id="score-board">
        УДАРОВ: <span id="current-score" style="color: #22c55e;">0</span>
        <div id="best-score">РЕКОРД: 0</div>
    </div>

    <div id="game-area">
        <div id="anvil-container">
            <div id="item">🔩</div>
        </div>

        <div id="bar-container">
            <div id="target-zone">
                <div id="perfect-zone"></div>
            </div>
            <div id="cursor"></div>
        </div>

        <div id="hint">ТАПНИ В МОМЕНТ УДАРА</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- Web Audio API (Синтезатор звуков без файлов) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                // Металлический звон удара
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(420, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'perfect') {
                // Звонкий крит-колокольчик
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1320, now + 0.18);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'fail') {
                // Глухой металлический хруст поломки
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // --- Виброотклик ---
        function triggerHaptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'perfect') tg.HapticFeedback.notificationOccurred('success');
                else if (type === 'hit') tg.HapticFeedback.impactOccurred('medium');
                else if (type === 'fail') tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            if (navigator.vibrate) {
                if (type === 'perfect') navigator.vibrate([30, 40, 60]);
                else if (type === 'hit') navigator.vibrate(35);
                else if (type === 'fail') navigator.vibrate([60, 60, 120]);
            }
        }

        // --- Эффект искр ---
        function createSparks(isPerfect) {
            const container = document.getElementById('anvil-container');
            const color = isPerfect ? '#facc15' : '#f97316';
            const count = isPerfect ? 24 : 12;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = color;
                p.style.left = '50%';
                p.style.top = '50%';
                container.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 30;
                const destX = Math.cos(angle) * distance;
                const destY = Math.sin(angle) * distance;

                p.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0)`, opacity: 0 }
                ], { duration: 400 + Math.random() * 200, easing: 'ease-out' }).onfinish = () => p.remove();
            }
        }

        // --- Игровая логика ---
        let score = 0;
        let bestScore = 0;
        let cursorPosition = 0;
        let direction = 1;
        let speed = 1.3;
        
        let targetStart = 35;
        let targetWidth = 24;

        const cursorEl = document.getElementById('cursor');
        const targetEl = document.getElementById('target-zone');
        const scoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const gameAreaEl = document.getElementById('game-area');
        const itemEl = document.getElementById('item');

        const items = ['🔩', '⚙️', '🗡️', '🛡️', '👑', '💎', '🔥'];

        function updateTargetZone() {
            targetWidth = Math.max(9, 24 - score * 0.6);
            targetStart = Math.random() * (100 - targetWidth - 10) + 5;
            targetEl.style.left = targetStart + '%';
            targetEl.style.width = targetWidth + '%';
        }

        function gameLoop() {
            cursorPosition += direction * speed;
            if (cursorPosition >= 100) { cursorPosition = 100; direction = -1; }
            else if (cursorPosition <= 0) { cursorPosition = 0; direction = 1; }
            cursorEl.style.left = cursorPosition + '%';
            requestAnimationFrame(gameLoop);
        }

        function handleHit(e) {
            e.preventDefault();

            const targetEnd = targetStart + targetWidth;
            const hitSuccess = cursorPosition >= targetStart && cursorPosition <= targetEnd;

            if (hitSuccess) {
                // Проверяем золотую зону Perfect (центр)
                const perfectStart = targetStart + targetWidth * 0.35;
                const perfectEnd = targetStart + targetWidth * 0.65;
                const isPerfect = cursorPosition >= perfectStart && cursorPosition <= perfectEnd;

                score += isPerfect ? 2 : 1;
                scoreEl.innerText = score;
                speed += 0.14;

                playSound(isPerfect ? 'perfect' : 'hit');
                triggerHaptic(isPerfect ? 'perfect' : 'hit');
                createSparks(isPerfect);

                itemEl.style.transform = 'scale(0.8)';
                setTimeout(() => itemEl.style.transform = 'scale(1)', 70);
                itemEl.innerText = items[score % items.length];

                updateTargetZone();
            } else {
                playSound('fail');
                triggerHaptic('fail');

                gameAreaEl.classList.add('shake');
                setTimeout(() => gameAreaEl.classList.remove('shake'), 250);

                if (score > bestScore) {
                    bestScore = score;
                    bestScoreEl.innerText = 'РЕКОРД: ' + bestScore;
                }

                score = 0;
                speed = 1.3;
                scoreEl.innerText = score;
                itemEl.innerText = '💥';
                setTimeout(() => { itemEl.innerText = items[0]; }, 350);

                updateTargetZone();
            }
        }

        gameAreaEl.addEventListener('pointerdown', handleHit);

        updateTargetZone();
        gameLoop();
    </script>
</body>
</html>
