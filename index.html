<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кузница Гнева</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #ui-container {
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .ui-box {
            background: #14161f;
            border: 1px solid #232736;
            border-radius: 12px;
            padding: 8px 14px;
            text-align: center;
        }
        .ui-label { font-size: 11px; color: #717b9e; text-transform: uppercase; font-weight: 700; }
        .ui-value { font-size: 20px; font-weight: 900; color: #f3f4f6; }
        
        #game-area {
            position: relative;
            width: 320px;
            height: 440px;
            background: radial-gradient(circle at 50% 30%, #1a1d29, #0e1017);
            border: 2px solid #282c3f;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #stage-info {
            text-align: center;
        }
        #item-name {
            font-size: 18px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.5px;
        }
        #item-level {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
        }
        /* Зона наковальни */
        #anvil-stage {
            position: relative;
            width: 100%;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #hammer {
            position: absolute;
            top: 10px;
            font-size: 54px;
            transform-origin: 80% 80%;
            transform: rotate(-35deg);
            transition: transform 0.06s ease-out;
            z-index: 5;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
        }
        #hammer.hit {
            transform: rotate(15deg) translateY(35px);
        }
        #hammer.broken {
            transform: rotate(70deg) translate(20px, 40px);
            opacity: 0.3;
        }
        #target-item {
            position: absolute;
            bottom: 40px;
            font-size: 64px;
            z-index: 2;
            transition: transform 0.05s ease-out, opacity 0.1s;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
        }
        #anvil {
            position: absolute;
            bottom: 10px;
            font-size: 46px;
            z-index: 1;
            opacity: 0.9;
        }
        /* Шкала тайминга */
        #bar-container {
            position: relative;
            width: 100%;
            height: 38px;
            background: #090a0f;
            border-radius: 19px;
            overflow: hidden;
            border: 2px solid #232736;
        }
        #target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            background: #22c55e;
            border-radius: 6px;
            transition: left 0.15s, width 0.15s;
        }
        #cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #ffffff;
            box-shadow: 0 0 12px #ffffff, 0 0 4px #ffffff;
            border-radius: 3px;
        }
        #hint {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: 1px;
        }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        .shake { animation: shakeEffect 0.3s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-12px, 6px); }
            40% { transform: translate(12px, -6px); }
            60% { transform: translate(-8px, 3px); }
            80% { transform: translate(8px, -3px); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box">
            <div class="ui-label">Разбито</div>
            <div class="ui-value" id="current-score">0</div>
        </div>
        <div class="ui-box">
            <div class="ui-label">Рекорд</div>
            <div class="ui-value" id="best-score" style="color: #eab308;">0</div>
        </div>
    </div>

    <div id="game-area">
        <div id="stage-info">
            <div id="item-name">Яйцо</div>
            <div id="item-level">ПРЕДМЕТ 1 ИЗ 12</div>
        </div>

        <div id="anvil-stage">
            <div id="hammer">🔨</div>
            <div id="target-item">🥚</div>
            <div id="anvil">🪨</div>
        </div>

        <div id="bar-container">
            <div id="target-zone"></div>
            <div id="cursor"></div>
        </div>

        <div id="hint">ТАПАЙ В ЗЕЛЕНУЮ ЗОНУ</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- База предметов (Лесенка прочности) ---
        const ITEMS = [
            { name: "Куриное яйцо", emoji: "🥚", color: ["#fff", "#fbbf24"], haptic: "light", freq: 500 },
            { name: "Спелый помидор", emoji: "🍅", color: ["#ef4444", "#b91c1c"], haptic: "light", freq: 450 },
            { name: "Сочный арбуз", emoji: "🍉", color: ["#22c55e", "#ef4444"], haptic: "medium", freq: 400 },
            { name: "Сухое полено", emoji: "🪵", color: ["#b45309", "#78350f"], haptic: "medium", freq: 350 },
            { name: "Глиняная ваза", emoji: "🏺", color: ["#d97706", "#f59e0b"], haptic: "medium", freq: 600 },
            { name: "Красный кирпич", emoji: "🧱", color: ["#dc2626", "#991b1b"], haptic: "heavy", freq: 300 },
            { name: "Гранитный валун", emoji: "🪨", color: ["#9ca3af", "#4b5563"], haptic: "heavy", freq: 250 },
            { name: "Чугунный замок", emoji: "🔒", color: ["#6b7280", "#374151"], haptic: "rigid", freq: 220 },
            { name: "Рыцарский щит", emoji: "🛡️", color: ["#60a5fa", "#3b82f6"], haptic: "rigid", freq: 700 },
            { name: "Золотой слиток", emoji: "🪙", color: ["#facc15", "#eab308"], haptic: "rigid", freq: 800 },
            { name: "Кристалл алмаза", emoji: "💎", color: ["#38bdf8", "#bae6fd"], haptic: "rigid", freq: 1100 },
            { name: "Ядро метеорита", emoji: "🪐", color: ["#a855f7", "#ec4899"], haptic: "rigid", freq: 150 }
        ];

        // --- Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound(freq, isFail = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isFail) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                return;
            }

            osc.type = freq > 600 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.4, now + 0.12);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        // --- Тактильный отклик ---
        function triggerHaptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'rigid') {
                    tg.HapticFeedback.impactOccurred('rigid');
                    setTimeout(() => tg.HapticFeedback.impactOccurred('heavy'), 40);
                } else if (type === 'fail') {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                return;
            }
            if (navigator.vibrate) {
                if (type === 'light') navigator.vibrate(20);
                else if (type === 'medium') navigator.vibrate(40);
                else if (type === 'heavy' || type === 'rigid') navigator.vibrate([30, 30, 60]);
                else if (type === 'fail') navigator.vibrate([80, 50, 150]);
            }
        }

        // --- Разлет осколков ---
        function createShatterEffect(colors) {
            const stage = document.getElementById('anvil-stage');
            for (let i = 0; i < 24; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.bottom = '70px';
                stage.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 90 + 30;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist - 20;

                p.animate([
                    { transform: 'translate(-50%, 0) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), ${y}px) scale(0)`, opacity: 0 }
                ], { duration: 400 + Math.random() * 200, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' }).onfinish = () => p.remove();
            }
        }

        // --- Состояние игры ---
        let currentIndex = 0;
        let bestScore = 0;
        let cursorPosition = 0;
        let direction = 1;
        let isProcessingHit = false;

        const cursorEl = document.getElementById('cursor');
        const targetEl = document.getElementById('target-zone');
        const scoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const gameAreaEl = document.getElementById('game-area');
        const itemNameEl = document.getElementById('item-name');
        const itemLevelEl = document.getElementById('item-level');
        const targetItemEl = document.getElementById('target-item');
        const hammerEl = document.getElementById('hammer');

        let targetStart = 35;
        let targetWidth = 26;
        let speed = 1.3;

        function updateItemDisplay() {
            const item = ITEMS[currentIndex];
            itemNameEl.innerText = item.name;
            itemLevelEl.innerText = `ПРЕДМЕТ ${currentIndex + 1} ИЗ ${ITEMS.length}`;
            targetItemEl.innerText = item.emoji;
            targetItemEl.style.opacity = '1';
            targetItemEl.style.transform = 'scale(1)';

            // Расчет сложности по формуле
            targetWidth = Math.max(7, 28 - currentIndex * 1.8);
            targetStart = Math.random() * (100 - targetWidth - 10) + 5;
            speed = 1.3 + (currentIndex * 0.22);

            targetEl.style.left = targetStart + '%';
            targetEl.style.width = targetWidth + '%';
        }

        function gameLoop() {
            cursorPosition += direction * speed;
            if (cursorPosition >= 100) { cursorPosition = 100; direction = -1; }
            else if (cursorPosition <= 0) { cursorPosition = 0; direction = 1; }
            cursorEl.style.left = cursorPosition + '%';
            requestAnimationFrame(gameLoop);
        }

        function handleHit(e) {
            e.preventDefault();
            if (isProcessingHit) return;

            const item = ITEMS[currentIndex];
            const targetEnd = targetStart + targetWidth;
            const hitSuccess = cursorPosition >= targetStart && cursorPosition <= targetEnd;

            // Анимация взмаха молота
            hammerEl.classList.add('hit');
            setTimeout(() => hammerEl.classList.remove('hit'), 120);

            if (hitSuccess) {
                isProcessingHit = true;
                playHitSound(item.freq);
                triggerHaptic(item.haptic);
                createShatterEffect(item.color);

                // Сплющивание и разрушение
                targetItemEl.style.transform = 'scale(1.3, 0.2)';
                targetItemEl.style.opacity = '0';

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex >= ITEMS.length) {
                        alert("ЛЕГЕНДА! ТЫ РАЗБИЛ ВСЁ!");
                        currentIndex = 0;
                    }
                    scoreEl.innerText = currentIndex;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 140);

            } else {
                // ПРОМАХ
                isProcessingHit = true;
                playHitSound(0, true);
                triggerHaptic('fail');

                hammerEl.classList.add('broken');
                gameAreaEl.classList.add('shake');

                if (currentIndex > bestScore) {
                    bestScore = currentIndex;
                    bestScoreEl.innerText = bestScore;
                }

                setTimeout(() => {
                    hammerEl.classList.remove('broken');
                    gameAreaEl.classList.remove('shake');
                    currentIndex = 0;
                    scoreEl.innerText = currentIndex;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 400);
            }
        }

        gameAreaEl.addEventListener('pointerdown', handleHit);

        updateItemDisplay();
        gameLoop();
    </script>
</body>
</html>
