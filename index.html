<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кузница Гнева</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #ui-container {
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .ui-box {
            background: #14161f;
            border: 1px solid #232736;
            border-radius: 14px;
            padding: 8px 16px;
            text-align: center;
            transition: all 0.4s ease;
        }
        /* Стадии комбо для блока со счетом */
        .ui-box.combo-1 { border-color: #f59e0b; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
        .ui-box.combo-2 { border-color: #ef4444; box-shadow: 0 0 16px rgba(239, 68, 68, 0.6); }
        .ui-box.combo-3 { border-color: #dc2626; box-shadow: 0 0 24px rgba(220, 38, 38, 0.9); transform: scale(1.05); }
        
        .ui-label { font-size: 10px; color: #717b9e; text-transform: uppercase; font-weight: 700; }
        .ui-value { font-size: 22px; font-weight: 900; color: #f3f4f6; }
        
        #game-area {
            position: relative;
            width: 330px;
            height: 480px;
            background: radial-gradient(circle at 50% 35%, #1f2333, #0a0b10);
            border: 2px solid #2d334a;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
            cursor: pointer;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            overflow: hidden;
        }
        #stage-info { text-align: center; }
        #item-name {
            font-size: 20px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
        }
        #item-level {
            font-size: 11px;
            color: #8b92a5;
            margin-top: 3px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        #anvil-stage {
            position: relative;
            width: 280px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #anvil {
            position: absolute;
            bottom: 0px;
            left: 35%;
            transform: translateX(-50%);
            width: 260px;
            height: 160px;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 14px 24px rgba(0,0,0,0.95));
        }

        #target-item {
            position: absolute;
            bottom: 82px;
            left: 38%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            object-fit: contain;
            z-index: 3;
            transition: transform 0.05s ease-out, opacity 0.08s;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
        }

        #hammer {
            position: absolute;
            bottom: 90px;
            left: 170px;
            width: 155px;
            height: 155px;
            object-fit: contain;
            transform-origin: 15% 85%;
            transform: rotate(-30deg) translate(0px, 0px);
            transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(-8px 12px 18px rgba(0,0,0,0.7));
        }

        #hammer.hit {
            transform: rotate(-85deg) translate(-42px, -15px);
        }

        #hammer.broken {
            transform: rotate(-120deg) translate(-60px, 40px);
            opacity: 0;
            transition: transform 0.25s ease-in, opacity 0.2s ease-out;
        }

        /* Сильное базовое свечение */
        #glow {
            position: absolute;
            bottom: 15px;
            left: 38%;
            transform: translateX(-50%) scale(1);
            width: 240px;
            height: 50px;
            background: radial-gradient(ellipse, rgba(56, 189, 248, 0.4), transparent 70%);
            z-index: 1;
            transition: all 0.5s ease;
        }

        /* Стадия 1: Разогрев (5+ попаданий) */
        #glow.combo-1 {
            background: radial-gradient(ellipse, rgba(245, 158, 11, 0.8), transparent 75%);
            transform: translateX(-50%) scale(1.1);
        }

        /* Стадия 2: Горячо (10+ попаданий) */
        #glow.combo-2 {
            background: radial-gradient(ellipse, rgba(239, 68, 68, 0.9), transparent 80%);
            transform: translateX(-50%) scale(1.2);
        }

        /* Стадия 3: Ярость (15+ попаданий) - пульсация */
        #glow.combo-3 {
            background: radial-gradient(ellipse, rgba(220, 38, 38, 1), transparent 85%);
            animation: ragePulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes ragePulse {
            0% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.4); opacity: 1; }
        }

        #bar-container {
            position: relative;
            width: 100%;
            height: 40px;
            background: #090a0f;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #232736;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }
        #target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            background: linear-gradient(180deg, #4ade80, #16a34a);
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
            transition: left 0.15s, width 0.15s;
        }
        #cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #ffffff;
            box-shadow: 0 0 14px #ffffff, 0 0 4px #ffffff;
            border-radius: 3px;
        }
        #hint {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: 1px;
        }
        .particle {
            position: absolute;
            border-radius: 3px;
            pointer-events: none;
            z-index: 10;
        }
        .shake { animation: shakeEffect 0.28s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 5px); }
            40% { transform: translate(10px, -5px); }
            60% { transform: translate(-6px, 3px); }
            80% { transform: translate(6px, -3px); }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="ui-box" id="score-box">
            <div class="ui-label">Разбито</div>
            <div class="ui-value" id="current-score">0</div>
        </div>
        <div class="ui-box">
            <div class="ui-label">Рекорд</div>
            <div class="ui-value" id="best-score" style="color: #eab308;">0</div>
        </div>
    </div>

    <div id="game-area">
        <div id="stage-info">
            <div id="item-name">Мыльный пузырь</div>
            <div id="item-level">УРОВЕНЬ 1</div>
        </div>

        <div id="anvil-stage">
            <div id="glow"></div>
            <img id="anvil" src="images/anvil.png?v=21" alt="Наковальня">
            <img id="target-item" src="images/1soap_bubble.png?v=21" alt="Предмет">
            <img id="hammer" src="images/hammer.png?v=21" alt="Молот">
        </div>

        <div id="bar-container">
            <div id="target-zone"></div>
            <div id="cursor"></div>
        </div>

        <div id="hint">ТАПАЙ В ЗЕЛЕНУЮ ЗОНУ</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { 
            tg.ready(); 
            tg.expand(); 
            tg.MainButton.setText("ПОДЕЛИТЬСЯ РЕКОРДОМ");
            tg.MainButton.onClick(() => {
                const text = `Я разбил ${bestScore} предметов в Кузнице Гнева! 🔥 Сможешь побить мой рекорд?`;
                // Вот здесь мы меняем ссылку на прямую (добавили /crazypunch в конец url):
                tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/crazypunch_bot/crazypunch&text=${encodeURIComponent(text)}`);
            });
        }

        const ITEMS = [
            { name: "Мыльный пузырь", src: "images/1soap_bubble.png", color: ["#a5f3fc", "#fbcfe8", "#ffffff"], freq: 850, size: 100, bottom: 82 },
            { name: "Легкий одуванчик", src: "images/2dandelion.png", color: ["#ffffff", "#fef08a", "#4ade80"], freq: 800, size: 120, bottom: 65 },
            { name: "Картофельный чипс", src: "images/3chip.png", color: ["#fef08a", "#f59e0b", "#fbbf24"], freq: 750, size: 110, bottom: 65 },
            { name: "Куриное яйцо", src: "images/4egg.png", color: ["#ffffff", "#fef08a", "#f59e0b"], freq: 520, size: 100, bottom: 82 },
            { name: "Спелый томат", src: "images/5tomato.png", color: ["#ef4444", "#dc2626", "#84cc16"], freq: 440, size: 100, bottom: 82 },
            { name: "Спелый банан", src: "images/6ripe_banana.png", color: ["#fef08a", "#eab308", "#16a34a"], freq: 400, size: 130, bottom: 55 },
            { name: "Стеклянный шар", src: "images/7hand-blown.png", color: ["#ffffff", "#9ca3af", "#e5e7eb"], freq: 650, size: 100, bottom: 82 },
            { name: "Лампочка", src: "images/8light_bulb.png", color: ["#ffffff", "#fef08a", "#d1d5db"], freq: 700, size: 90, bottom: 82 },
            { name: "Плитка шоколада", src: "images/9milk_chocolate.png", color: ["#78350f", "#92400e", "#b45309"], freq: 450, size: 110, bottom: 65 },
            { name: "Хрустящее печенье", src: "images/10cookie.png", color: ["#d97706", "#b45309", "#92400e"], freq: 500, size: 110, bottom: 70 },
            { name: "Сочное яблоко", src: "images/11apple.png", color: ["#ef4444", "#22c55e", "#fef08a"], freq: 460, size: 100, bottom: 82 },
            { name: "Стеклянный бокал", src: "images/12glassgoblet.png", color: ["#ffffff", "#e5e7eb", "#9ca3af"], freq: 750, size: 90, bottom: 82 },
            { name: "Керамическая кружка", src: "images/13ceramicmug.png", color: ["#f3f4f6", "#d1d5db", "#9ca3af"], freq: 550, size: 100, bottom: 82 },
            { name: "Стеклянная бутылка", src: "images/14bottle.png", color: ["#22c55e", "#16a34a", "#ffffff"], freq: 650, size: 100, bottom: 82 },
            { name: "Цветочный горшок", src: "images/15flower_pot.png", color: ["#b45309", "#d97706", "#92400e"], freq: 350, size: 110, bottom: 78 },
            { name: "Трехлитровая банка", src: "images/16glass3liter.png", color: ["#ffffff", "#e5e7eb", "#a7f3d0"], freq: 500, size: 110, bottom: 82 }
        ];

        let currentIndex = 0;
        let bestScore = 0;
        let cursorPosition = 0;
        let direction = 1;
        let isProcessingHit = false;
        let comboCounter = 0;

        const cursorEl = document.getElementById('cursor');
        const targetEl = document.getElementById('target-zone');
        const scoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const gameAreaEl = document.getElementById('game-area');
        const itemNameEl = document.getElementById('item-name');
        const itemLevelEl = document.getElementById('item-level');
        const targetItemEl = document.getElementById('target-item');
        const hammerEl = document.getElementById('hammer');
        const glowEl = document.getElementById('glow');
        const scoreBoxEl = document.getElementById('score-box');

        let localScore = localStorage.getItem('cp_best_score');
        if (localScore) {
            bestScore = parseInt(localScore, 10);
            bestScoreEl.innerText = bestScore;
        }

        if (tg && tg.CloudStorage) {
            tg.CloudStorage.getItem('cp_best_score', function(err, value) {
                if (!err && value) {
                    const cloudScore = parseInt(value, 10);
                    if (cloudScore > bestScore) {
                        bestScore = cloudScore;
                        bestScoreEl.innerText = bestScore;
                        localStorage.setItem('cp_best_score', bestScore.toString());
                    }
                }
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHitSound(freq, isFail = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isFail) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                return;
            }

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.35, now + 0.12);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        function triggerHaptic(type) {
            try {
                if (tg && tg.HapticFeedback) {
                    if (type === 'hit') tg.HapticFeedback.impactOccurred('heavy');
                    else if (type === 'fail') tg.HapticFeedback.notificationOccurred('error');
                }
            } catch (err) {}

            if (navigator.vibrate) {
                if (type === 'hit') navigator.vibrate(40);
                else if (type === 'fail') navigator.vibrate([60, 40, 100]);
            }
        }

        function createShatterEffect(colors) {
            const stage = document.getElementById('anvil-stage');
            
            // Количество осколков увеличивается в зависимости от стадии комбо
            let particlesCount = 40;
            if (comboCounter >= 15) particlesCount = 100;
            else if (comboCounter >= 10) particlesCount = 75;
            else if (comboCounter >= 5)  particlesCount = 55;
            
            for (let i = 0; i < particlesCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                
                const size = Math.random() * 14 + 8; 
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '38%'; 
                p.style.bottom = '110px';
                stage.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                // Разлет тоже становится сильнее на высоких комбо
                const baseDist = comboCounter >= 15 ? 180 : 140;
                const dist = Math.random() * baseDist + 40; 
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist - 30;

                const rot = Math.random() * 360;

                p.animate([
                    { transform: `translate(-50%, 0) scale(1) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), ${y}px) scale(0) rotate(${rot}deg)`, opacity: 0 }
                ], { duration: 400 + Math.random() * 200, easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)' }).onfinish = () => p.remove();
            }
        }

        function updateItemDisplay() {
            const item = ITEMS[currentIndex % ITEMS.length];
            
            itemNameEl.innerText = item.name;
            itemLevelEl.innerText = `УРОВЕНЬ ${currentIndex + 1}`; 
            
            targetItemEl.style.width = (item.size || 100) + 'px';
            targetItemEl.style.height = (item.size || 100) + 'px';
            targetItemEl.style.bottom = (item.bottom || 82) + 'px';
            
            targetItemEl.src = item.src;
            targetItemEl.style.opacity = '1';
            targetItemEl.style.transform = 'translateX(-50%) scale(1)';

            targetWidth = Math.max(8, 28 - currentIndex * 1.5); 
            targetStart = Math.random() * (100 - targetWidth - 10) + 5;
            speed = 1.3 + (currentIndex * 0.15); 

            targetEl.style.left = targetStart + '%';
            targetEl.style.width = targetWidth + '%';
        }

        function updateComboVisuals() {
            // Очищаем старые классы
            glowEl.className = '';
            scoreBoxEl.className = 'ui-box';

            // Навешиваем новые в зависимости от набитого счетчика
            if (comboCounter >= 15) {
                glowEl.classList.add('combo-3');
                scoreBoxEl.classList.add('combo-3');
            } else if (comboCounter >= 10) {
                glowEl.classList.add('combo-2');
                scoreBoxEl.classList.add('combo-2');
            } else if (comboCounter >= 5) {
                glowEl.classList.add('combo-1');
                scoreBoxEl.classList.add('combo-1');
            }
        }

        function gameLoop() {
            cursorPosition += direction * speed;
            if (cursorPosition >= 100) { cursorPosition = 100; direction = -1; }
            else if (cursorPosition <= 0) { cursorPosition = 0; direction = 1; }
            cursorEl.style.left = cursorPosition + '%';
            requestAnimationFrame(gameLoop);
        }

        function handleHit(e) {
            e.preventDefault();
            if (isProcessingHit) return;

            if (tg && tg.MainButton.isVisible) {
                tg.MainButton.hide();
            }

            const item = ITEMS[currentIndex % ITEMS.length];
            const targetEnd = targetStart + targetWidth;
            const hitSuccess = cursorPosition >= targetStart && cursorPosition <= targetEnd;

            if (hitSuccess) {
                isProcessingHit = true;
                comboCounter++; 
                updateComboVisuals(); // Обновляем цвет свечения

                hammerEl.classList.add('hit');
                triggerHaptic('hit');
                playHitSound(item.freq);

                setTimeout(() => {
                    createShatterEffect(item.color);
                    targetItemEl.style.transform = 'translateX(-50%) scale(1.3, 0.15)';
                    targetItemEl.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    hammerEl.classList.remove('hit');
                }, 130);

                setTimeout(() => {
                    currentIndex++;
                    scoreEl.innerText = Number(scoreEl.innerText) + 1;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 170);

            } else {
                isProcessingHit = true;
                
                // Сброс комбо при промахе
                comboCounter = 0; 
                updateComboVisuals();

                hammerEl.classList.add('broken');
                triggerHaptic('fail');
                playHitSound(0, true);
                
                gameAreaEl.classList.add('shake');

                const finalScore = Number(scoreEl.innerText);
                if (finalScore > bestScore) {
                    bestScore = finalScore;
                    bestScoreEl.innerText = bestScore;

                    localStorage.setItem('cp_best_score', bestScore.toString());
                    
                    if (tg && tg.CloudStorage) {
                        tg.CloudStorage.setItem('cp_best_score', bestScore.toString());
                    }
                }

                if (tg && finalScore > 0) {
                    tg.MainButton.show();
                }

                setTimeout(() => {
                    hammerEl.classList.remove('broken');
                    gameAreaEl.classList.remove('shake');
                    currentIndex = 0;
                    scoreEl.innerText = 0;
                    updateItemDisplay();
                    isProcessingHit = false;
                }, 400);
            }
        }

        gameAreaEl.addEventListener('pointerdown', handleHit);

        updateItemDisplay();
        gameLoop();
    </script>
</body>
</html>
